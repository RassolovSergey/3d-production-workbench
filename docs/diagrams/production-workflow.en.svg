<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Artifact workflow / review gates</title><desc id="desc">Automate routine operations; keep creative and release decisions with the operator</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="a-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker></defs><rect width="1200" height="950" rx="18" fill="#020617"/><rect width="1200" height="950" rx="18" fill="url(#grid)" opacity=".55"/><g font-family="JetBrains Mono,Consolas,monospace"><text x="48" y="52" fill="#f8fafc" font-size="28" font-weight="600" text-anchor="start">Artifact workflow / review gates</text><text x="48" y="82" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Automate routine operations; keep creative and release decisions with the operator</text><text x="60" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">01 / DEFINE</text><text x="450" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">02 / PREPARE</text><text x="840" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">03 / PRODUCE</text><rect x="48" y="810" width="1104" height="78" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="70" y="839" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="start">States are not interchangeable</text><text x="70" y="865" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Selected reference ≠ finished geometry ≠ print-ready model ≠ published product.</text><path d="M360 222H448" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M750 222H838" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)"/><path d="M990 274V398" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M840 436H752" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)"/><path d="M750 480H838" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)" stroke-dasharray="7 6"/><path d="M990 504V628" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M840 682H752" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M450 682H362" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-api)"/><rect x="60" y="170" width="300" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="190" width="4" height="64" rx="2" fill="#22d3ee"/><text x="94" y="205" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Concept</text><text x="94" y="232" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Intent and reference</text><text x="94" y="253" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">candidates</text><rect x="450" y="170" width="300" height="104" rx="14" fill="#0f172a" stroke="#fb7185" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="190" width="4" height="64" rx="2" fill="#fb7185"/><text x="484" y="205" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Owner decision</text><text x="484" y="232" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Accept / defer</text><text x="484" y="253" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Reversible archive</text><rect x="840" y="170" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="190" width="4" height="64" rx="2" fill="#34d399"/><text x="874" y="205" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Preparation</text><text x="874" y="232" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Inputs and formats</text><text x="874" y="253" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Manual batch export</text><rect x="840" y="400" width="300" height="104" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="420" width="4" height="64" rx="2" fill="#94a3b8"/><text x="874" y="435" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Generation / import</text><text x="874" y="462" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">External execution</text><text x="874" y="483" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Format and matching</text><rect x="450" y="400" width="300" height="104" rx="14" fill="#0f172a" stroke="#fb7185" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="420" width="4" height="64" rx="2" fill="#fb7185"/><text x="484" y="435" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Manual review</text><text x="484" y="462" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Ambiguous results</text><text x="484" y="483" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Repeat matching</text><rect x="840" y="630" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="650" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="665" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Model catalogue</text><text x="874" y="692" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Accepted result</text><text x="874" y="713" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Link to source</text><rect x="450" y="630" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="650" width="4" height="64" rx="2" fill="#34d399"/><text x="484" y="665" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Refinement</text><text x="484" y="692" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Sculpting and rendering</text><text x="484" y="713" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Output review</text><rect x="60" y="630" width="300" height="104" rx="14" fill="#0f172a" stroke="#fb7185" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="650" width="4" height="64" rx="2" fill="#fb7185"/><text x="94" y="665" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Release materials</text><text x="94" y="692" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Readiness decision</text><text x="94" y="713" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Separate publication</text><rect x="946.1" y="325" width="127.8" height="24" rx="6" fill="#020617"/><text x="1010" y="341" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Manual start</text><rect x="735.4" y="373" width="119.19999999999999" height="24" rx="6" fill="#020617"/><text x="795" y="389" fill="#fb7185" font-size="14" font-weight="400" text-anchor="middle">Ambiguous</text><rect x="991.9" y="556" width="76.19999999999999" height="24" rx="6" fill="#020617"/><text x="1030" y="572" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Accepted</text><circle cx="54" cy="916" r="5" fill="#22d3ee"/><text x="70" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Interface</text><circle cx="256" cy="916" r="5" fill="#34d399"/><text x="272" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Service</text><circle cx="471" cy="916" r="5" fill="#a78bfa"/><text x="487" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Storage</text><circle cx="686" cy="916" r="5" fill="#fb7185"/><text x="702" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Human decision</text><circle cx="891" cy="916" r="5" fill="#94a3b8"/><text x="907" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">External system</text></g></svg>