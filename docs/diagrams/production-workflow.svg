<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Путь артефакта / контрольные переходы</title><desc id="desc">Автоматизируется механика; художественные и выпускные решения остаются за оператором</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="a-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker></defs><rect width="1200" height="950" rx="18" fill="#020617"/><rect width="1200" height="950" rx="18" fill="url(#grid)" opacity=".55"/><g font-family="JetBrains Mono,Consolas,monospace"><text x="48" y="52" fill="#f8fafc" font-size="28" font-weight="600" text-anchor="start">Путь артефакта / контрольные переходы</text><text x="48" y="82" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Автоматизируется механика; художественные и выпускные решения остаются за оператором</text><text x="60" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">01 / ОПРЕДЕЛИТЬ</text><text x="450" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">02 / ПОДГОТОВИТЬ</text><text x="840" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">03 / ПОЛУЧИТЬ</text><rect x="48" y="810" width="1104" height="78" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="70" y="839" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="start">Состояния не равнозначны</text><text x="70" y="865" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Выбранный референс ≠ готовая геометрия ≠ пригодная к печати модель ≠ опубликованный продукт.</text><path d="M360 222H448" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M750 222H838" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)"/><path d="M990 274V398" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M840 436H752" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)"/><path d="M750 480H838" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)" stroke-dasharray="7 6"/><path d="M990 504V628" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M840 682H752" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M450 682H362" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-api)"/><rect x="60" y="170" width="300" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="190" width="4" height="64" rx="2" fill="#22d3ee"/><text x="94" y="205" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Концепт</text><text x="94" y="232" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Замысел 