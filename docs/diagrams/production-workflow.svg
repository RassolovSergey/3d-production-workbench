 font-size="14" font-weight="400" text-anchor="middle">Ручной запуск</text><rect x="735.4" y="373" width="119.19999999999999" height="24" rx="6" fill="#020617"/><text x="795" y="389" fill="#fb7185" font-size="14" font-weight="400" text-anchor="middle">Неоднозначно</text><rect x="991.9" y="556" width="76.19999999999999" height="24" rx="6" fill="#020617"/><text x="1030" y="572" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Принято</text><circle cx="54" cy="916" r="5" fill="#22d3ee"/><text x="70" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Интерфейс</text><circle cx="256" cy="916" r="5" fill="#34d399"/><text x="272" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Сервис</text><circle cx="471" cy="916" r="5" fill="#a78bfa"/><text x="487" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Хранилище</text><circle cx="686" cy="916" r="5" fill="#fb7185"/><text x="702" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Решение человека</text><circle cx="891" cy="916" r="5" fill="#94a3b8"/><text x="907" y="921" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Внешняя система</text></g></svg>